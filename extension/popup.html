<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 300px;
            padding: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }
        .logo {
            width: 32px;
            height: 32px;
            background: #056E73;
            border-radius: 8px;
            margin-right: 12px;
            background-image: url('icons/icon48.png');
            background-size: cover;
        }
        h2 {
            margin: 0;
            font-size: 18px;
            color: #056E73;
            font-weight: 800;
        }
        .info {
            font-size: 13px;
            color: #5f6368;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #056E73;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
            text-decoration: none;
        }
        .btn:hover {
            background: #045a5e;
        }
        .status {
            margin-top: 12px;
            font-size: 12px;
            text-align: center;
            color: #10B981;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo"></div>
        <h2>AI Leads</h2>
    </div>
    <p class="info">
        Open Google Maps, search for businesses, and click the <b>Scrape Leads</b> button on the screen to capture leads directly to your CRM.
    </p>
    <a href="https://ai-leads.brainket.online" target="_blank" class="btn">View Dashboard</a>
    <div id="status" class="status">Connected to live system</div>
</body>
</html>
